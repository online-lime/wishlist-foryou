if(state.page==='checkout'){let it=state.giftItems.find(x=>x.id===state.giftSelected),x=it&&prod(it.id);if(!x){goto('gift');return}h=`${crumb('Оформление заказа')}<div class="checkout"><div class="checkout-form"><div class="eyebrow">CHECKOUT / LIMÉ</div><h1>Оформление<br><i>подарка</i></h1><label class="field-label" for="name">Ваше имя</label><input id="name" class="field" placeholder="Как к вам обращаться"><label class="field-label" for="email">Электронная почта</label><input id="email" type="email" class="field" placeholder="name@example.com"><label class="field-label" for="address">Адрес доставки</label><input id="address" class="field" placeholder="Город, улица, дом, квартира"><label class="switch" style="margin:25px 0"><input type="checkbox" id="agree"> Я согласен(на) на демонстрационное оформление</label>${state.error?`<div class="warn">${escapeHTML(state.error)}</div>`:''}<button class="button wide" data-action="order">Подтвердить заказ · ${fmt(x.price)} ↗</button><p class="smallprint">Это учебный прототип. Настоящая оплата и отправка заказа не выполняются.</p></div><aside class="order-summary"><div class="eyebrow">ВАШ ЗАКАЗ</div><div class="summary-item">${photo(x)}<div><strong>${escapeHTML(x.name)}</strong><p class="wish-meta">${escapeHTML(x.colors[it.color]?.[0])}<br>Размер ${escapeHTML(it.size)}</p><p>${fmt(x.price)}</p></div></div><div class="summary-total"><span>Итого</span><span>${fmt(x.price)}</span></div></aside></div>`}
if(state.page==='done'){h=`${crumb('Готово')}<div class="thankyou"><div class="eyebrow">YOUR GIFT IS ON ITS WAY / DEMO</div><h1>Прекрасный<br><i>выбор.</i></h1><p class="sub" style="margin:20px auto">Демонстрационный заказ оформлен. В настоящем магазине здесь появилось бы подтверждение покупки и информация о доставке.</p><div class="actions" style="justify-content:center"><button class="button" data-go="welcome">На главную</button><button class="button light" data-go="gift">Посмотреть другие желания</button></div></div>`}
$('#app').innerHTML=h;document.querySelectorAll('.mobile-nav [data-go]').forEach(b=>{const target=b.dataset.go;const active=(state.page==='product'&&target==='catalog')||(state.page==='share'&&target==='wishlist')||(state.page==='checkout'&&target==='gift')||(state.page==='done'&&target==='gift')||state.page===target;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function copyText(v){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(v);const el=document.createElement('textarea');el.value=v;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}el.remove();return ok?Promise.resolve():Promise.reject(new Error('clipboard unavailable'))}
document.addEventListener('click',async e=>{let target=e.target.closest('[data-go],[data-product],[data-gift],[data-color],[data-size],[data-filter],[data-edit],[data-remove],[data-action]');if(!target)return;
if(target.dataset.go){if(target.dataset.go==='gift')loadGift();goto(target.dataset.go);return}
if(target.dataset.product){openProduct(target.dataset.product);return}
if(target.dataset.edit){openProduct(target.dataset.edit,true);return}
if(target.dataset.remove){state.items=state.items.filter(x=>x.id!==Number(target.dataset.remove));save();render();notify('Вещь удалена из списка');return}
if(target.dataset.gift){state.giftSelected=Number(target.dataset.gift);state.unavailable=false;goto('gift-product');return}
if(target.dataset.color!==undefined){state.color=Number(target.dataset.color);state.error='';render();return}
if(target.dataset.size!==undefined){state.size=target.dataset.size;state.error='';render();return}
if(target.dataset.filter){state.filter=target.dataset.filter;render();return}
const a=target.dataset.action;if(!a)return;
if(a==='add'){add();return}
if(a==='sms'){let phone=$('#phone')?.value.trim()||'';let digits=phone.replace(/\D/g,'');if(digits.length===10)digits='7'+digits;if(digits.length!==11||digits[0]!=='7'){state.error='Укажите номер телефона из 10 цифр после +7.';render();return}state.phone='+7 '+digits.slice(1,4)+' '+digits.slice(4,7)+'-'+digits.slice(7,9)+'-'+digits.slice(9);save();goto('otp');return}
if(a==='verify'){if($('#otp')?.value.trim()!=='1234'){state.error='Неверный код. Введите тестовый код 1234.';render();return}state.auth=true;save();goto('wishlist');return}
if(a==='copy'){try{await copyText(makeLink());notify('Ссылка скопирована')}catch(e){notify('Выделите и скопируйте ссылку из поля выше вручную')}return}
if(a==='open-gift'){loadGift();goto('gift');return}
if(a==='clear-search'){state.search='';state.filter='Все';render();return}
if(a==='buy'){if(state.unavailable){state.error='Выбранный размер временно недоступен. Выберите другую вещь из списка.';render();return}goto('checkout');return}
if(a==='order'){let name=$('#name')?.value.trim(),email=$('#email')?.value.trim(),address=$('#address')?.value.trim(),agree=$('#agree')?.checked;if(!name||!email||!/^\S+@\S+\.\S+$/.test(email)||!address||!agree){state.error='Укажите имя, действующий e-mail, адрес доставки и подтвердите согласие.';render();return}goto('done');return}
if(a==='reset'){if(confirm('Удалить демонстрационные данные и начать заново?')){try{localStorage.removeItem('lime-2026-wishlist')}catch(e){}state={page:'welcome',items:[],auth:false,phone:'',access:true,selected:1,color:-1,size:'',editing:false,filter:'Все',search:'',error:'',giftItems:[],giftSelected:null,unavailable:false,orderDone:false};history.replaceState({},'',location.pathname);render()}return}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;let focused=state.search;render();const input=$('#search');input?.focus();input?.setSelectionRange(focused.length,focused.length)}});
document.addEventListener('change',e=>{if(e.target.id==='sharing'){state.access=e.target.checked;save();notify(state.access?'Доступ по ссылке включён':'Доступ по ссылке отключён');render()}if(e.target.id==='notAvailable'){state.unavailable=e.target.checked;state.error='';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.page==='auth'&&e.target.id==='phone')$('[data-action="sms"]')?.click();if(e.key==='Enter'&&state.page==='otp'&&e.target.id==='otp')$('[data-action="verify"]')?.click()});
if(new URLSearchParams(location.search).has('gift')){state.page='gift';loadGift()};render();
</script></body></html>
